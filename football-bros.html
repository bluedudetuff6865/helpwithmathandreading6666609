<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b14">
  <title>Football Bros</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: #090b14; color: white; font-family: system-ui, sans-serif; }
    .top { min-height: 64px; display: flex; align-items: center; gap: 16px; padding: 10px 4%; border-bottom: 1px solid #25283a; }
    .top h1 { margin: 0; font-size: clamp(20px, 5vw, 28px); }
    .back { color: #c9c4ff; text-decoration: none; font-weight: 700; white-space: nowrap; }
    main { width: min(1200px, 100%); margin: 0 auto; padding: 20px; }
    .game-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
    .open-game { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 10px; background: #7c5cff; color: white; font-weight: 800; text-decoration: none; touch-action: manipulation; }
    .hint { margin: 0; color: #b7bbcc; font-size: 14px; }
    .frame { width: 100%; height: min(75vh, 760px); min-height: 360px; overflow: hidden; border: 1px solid #30344a; border-radius: 14px; background: #000; touch-action: manipulation; }
    iframe { display: block; width: 100%; height: 100%; border: 0; touch-action: manipulation; }
    @media (max-width: 700px) {
      .top { padding: 10px 16px; }
      main { padding: 12px; }
      .frame { height: calc(100dvh - 150px); min-height: 320px; border-radius: 10px; }
    }
    @media (orientation: landscape) and (max-height: 600px) {
      .top { min-height: 48px; }
      .frame { height: calc(100dvh - 115px); min-height: 220px; }
    }
  </style>
</head>
<body>
  <header class="top"><a class="back" href="index.html">← Back</a><h1>Football Bros</h1></header>
  <main>
    <div class="game-actions">
      <a class="open-game" href="https://football-bros.org/game/football-bros/" target="_blank" rel="noopener noreferrer">Open game directly</a>
      <p class="hint">On iPad, use “Open game directly” if the embedded game does not respond to touch.</p>
    </div>
    <div class="frame"><iframe src="https://football-bros.org/game/football-bros/" title="Football Bros" allow="fullscreen; gamepad" allowfullscreen></iframe></div>
  </main>
</body>
</html>
