<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Arcade</title>
  <style>
    :root{--bg:#090b14;--panel:#171a2b;--muted:#9ea4ba;--white:#f7f7fb;--accent:#7c5cff}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--white)}
    header{height:72px;display:flex;align-items:center;padding:0 5%;border-bottom:1px solid #24283b}.brand{font-size:23px;font-weight:900}.brand span{color:var(--accent)}
    nav{margin-left:auto;display:flex;gap:28px}nav a{color:var(--muted);text-decoration:none;font-weight:700}nav a:hover{color:white}
    main{max-width:1180px;margin:auto;padding:45px 24px}.hero{margin-bottom:38px}.hero h1{font-size:clamp(38px,7vw,74px);line-height:.95;margin:0 0 18px}.hero h1 span{color:var(--accent)}.hero p{color:var(--muted);font-size:18px}
    .genres{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.genre{border:1px solid #30344a;background:transparent;color:#c9ccda;border-radius:999px;padding:10px 16px;cursor:pointer}.genre.active,.genre:hover{background:var(--accent);border-color:var(--accent);color:white}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:var(--panel);border-radius:16px;overflow:hidden;text-decoration:none;color:white;border:1px solid #232740;transition:.2s}.card:hover{transform:translateY(-5px);border-color:var(--accent)}
    .thumb{height:150px;background:linear-gradient(135deg,#2a315c,#8b62d8);display:grid;place-items:center;font-size:54px}.card:nth-child(2) .thumb{background:linear-gradient(135deg,#be6b29,#f4b63d)}.card:nth-child(3) .thumb{background:linear-gradient(135deg,#315a7d,#5dc6bb)}
    .card-body{padding:16px}.tag{color:#aaaef5;font-size:12px;text-transform:uppercase;font-weight:800}.card h2{font-size:19px;margin:7px 0 4px}.card p{color:var(--muted);font-size:14px;margin:0}
    @media(max-width:600px){nav a:first-child{display:none}.hero{margin-bottom:25px}}
  </style>
</head>
<body>
<header><div class="brand">PLAY<span>BOX</span></div><nav><a href="#games">Games</a><a href="#genres">Genres</a></nav></header>
<main><section class="hero"><h1>Find your<br><span>next game.</span></h1><p>Sports, racing, action, and arcade favorites—one click away.</p></section>
<section id="genres"><div class="genres"><button class="genre active" data-filter="all">All</button><button class="genre" data-filter="sports">Sports</button><button class="genre" data-filter="racing">Racing</button><button class="genre" data-filter="arcade">Arcade</button></div>
<div class="grid" id="games">
  <a class="card" data-category="sports" href="football-bros.html"><div class="thumb">🏈</div><div class="card-body"><span class="tag">Sports</span><h2>Football Bros</h2><p>Fast-paced American football action.</p></div></a>
  <a class="card" data-category="sports" href="basket-bros.html"><div class="thumb">🏀</div><div class="card-body"><span class="tag">Sports</span><h2>Basket Bros</h2><p>High-flying basketball battles.</p></div></a>
  <a class="card" data-category="racing arcade" href="speed-stars.html"><div class="thumb">🏁</div><div class="card-body"><span class="tag">Racing · Arcade</span><h2>Speed Stars</h2><p>Race to the finish line.</p></div></a>
</div></section></main>
<script>document.querySelectorAll('.genre').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.genre.active').classList.remove('active');button.classList.add('active');const filter=button.dataset.filter;document.querySelectorAll('.card').forEach(card=>card.hidden=filter!=='all'&&!card.dataset.category.includes(filter))}))</script>
</body></html>
